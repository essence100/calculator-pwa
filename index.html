<body>

```
<main class="calculator">

    <!-- HEADER -->
    <header class="calculator-header">

        <h1>Calculator</h1>

        <button
            id="themeBtn"
            class="theme-btn"
            type="button"
            aria-label="Switch calculator theme"
        >
            <i
                class="fa-solid fa-sun"
                aria-hidden="true"
            ></i>
        </button>

    </header>


    <!-- DISPLAY -->
    <section
        id="calculatorDisplay"
        class="display"
        aria-label="Calculator display"
    >

        <div
            id="displayBackground"
            class="display-background"
            aria-hidden="true"
        ></div>

        <div
            class="display-overlay"
            aria-hidden="true"
        ></div>

        <div class="display-content">

            <div
                id="historyDisplay"
                class="history-display"
                aria-label="Previous calculation"
            ></div>

            <div
                id="currentDisplay"
                class="current-display"
                aria-label="Current calculator value"
            >
                0
            </div>

        </div>

    </section>


    <!-- SCIENTIFIC CALCULATOR -->
    <section
        class="scientific-buttons"
        aria-label="Scientific calculator functions"
    >

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="sin"
            aria-label="Sine"
        >
            sin
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="cos"
            aria-label="Cosine"
        >
            cos
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="tan"
            aria-label="Tangent"
        >
            tan
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="sqrt"
            aria-label="Square root"
        >
            √
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="square"
            aria-label="Square"
        >
            x²
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="power"
            aria-label="Power"
        >
            xʸ
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="pi"
            aria-label="Pi"
        >
            π
        </button>

        <button
            class="btn scientific"
            type="button"
            data-action="scientific"
            data-value="inverse"
            aria-label="Inverse"
        >
            1/x
        </button>

    </section>


    <!-- MAIN CALCULATOR BUTTONS -->
    <section
        class="buttons"
        aria-label="Calculator keypad"
    >

        <button
            class="btn function"
            type="button"
            data-action="clear"
            aria-label="Clear calculator"
        >
            AC
        </button>

        <button
            class="btn function delete-btn"
            type="button"
            data-action="delete"
            aria-label="Delete last entry"
        >
            DEL
        </button>

        <button
            class="btn function"
            type="button"
            data-action="percentage"
            aria-label="Percentage"
        >
            %
        </button>

        <button
            class="btn operator"
            type="button"
            data-action="operator"
            data-value="/"
            aria-label="Divide"
        >
            ÷
        </button>


        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="7"
            aria-label="Seven"
        >
            7
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="8"
            aria-label="Eight"
        >
            8
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="9"
            aria-label="Nine"
        >
            9
        </button>

        <button
            class="btn operator"
            type="button"
            data-action="operator"
            data-value="*"
            aria-label="Multiply"
        >
            ×
        </button>


        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="4"
            aria-label="Four"
        >
            4
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="5"
            aria-label="Five"
        >
            5
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="6"
            aria-label="Six"
        >
            6
        </button>

        <button
            class="btn operator"
            type="button"
            data-action="operator"
            data-value="-"
            aria-label="Subtract"
        >
            −
        </button>


        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="1"
            aria-label="One"
        >
            1
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="2"
            aria-label="Two"
        >
            2
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="3"
            aria-label="Three"
        >
            3
        </button>

        <button
            class="btn operator"
            type="button"
            data-action="operator"
            data-value="+"
            aria-label="Add"
        >
            +
        </button>


        <button
            class="btn number zero"
            type="button"
            data-action="number"
            data-value="0"
            aria-label="Zero"
        >
            0
        </button>

        <button
            class="btn number"
            type="button"
            data-action="number"
            data-value="."
            aria-label="Decimal point"
        >
            .
        </button>

        <button
            class="btn equals"
            type="button"
            data-action="equals"
            aria-label="Calculate result"
        >
            =
        </button>

    </section>


    <!-- HISTORY -->
    <button
        id="historyBtn"
        class="history-toggle"
        type="button"
        aria-label="Show or hide calculation history"
        aria-controls="historyPanel"
    >
        HISTORY
    </button>

    <section
        id="historyPanel"
        class="history-panel hidden"
        aria-label="Calculation history"
    >

        <div class="history-header">

            <h2>Calculation History</h2>

            <button
                id="clearHistoryBtn"
                class="clear-history"
                type="button"
                aria-label="Clear calculation history"
            >
                Clear
            </button>

        </div>

        <div
            id="historyList"
            class="history-list"
        ></div>

    </section>


    <!-- DISPLAY BACKGROUND SETTINGS -->
    <button
        id="backgroundSettingsBtn"
        class="background-settings-toggle"
        type="button"
        aria-label="Show or hide display background settings"
        aria-controls="backgroundSettings"
    >
        DISPLAY BACKGROUND
    </button>

    <section
        id="backgroundSettings"
        class="background-settings hidden"
        aria-label="Display background settings"
    >

        <div class="background-settings-header">
            <h2>Display Background</h2>
        </div>


        <!-- BACKGROUND ON / OFF -->
        <div class="setting-row">

            <span id="backgroundStatusLabel">
                Background
            </span>

            <button
                id="backgroundToggle"
                class="setting-switch active"
                type="button"
                aria-label="Turn display background on or off"
            >
                ON
            </button>

        </div>


        <!-- BACKGROUND STYLE -->
        <div class="setting-group">

            <h3>Style</h3>

            <div
                class="background-options"
                aria-label="Background style options"
            >

                <button
                    class="background-option active"
                    data-background="abstract"
                    type="button"
                    aria-label="Use abstract background"
                >
                    Abstract
                </button>

                <button
                    class="background-option"
                    data-background="technology"
                    type="button"
                    aria-label="Use technology background"
                >
                    Technology
                </button>

                <button
                    class="background-option"
                    data-background="custom"
                    type="button"
                    aria-label="Use custom background"
                >
                    Custom
                </button>

            </div>

        </div>


        <!-- OPACITY -->
        <div class="setting-group">

            <label for="backgroundOpacity">
                Background opacity
            </label>

            <input
                id="backgroundOpacity"
                type="range"
                min="10"
                max="40"
                value="25"
                aria-label="Background opacity"
            >

        </div>


        <!-- ANIMATION -->
        <div class="setting-row">

            <span id="animationStatusLabel">
                Animation
            </span>

            <button
                id="backgroundAnimationToggle"
                class="setting-switch active"
                type="button"
                aria-label="Turn background animation on or off"
            >
                ON
            </button>

        </div>


        <!-- CUSTOM IMAGE -->
        <div
            id="customBackgroundArea"
            class="custom-background-area hidden"
        >

            <label for="customBackgroundInput">
                Custom Image
            </label>

            <div
                id="customBackgroundPreview"
                class="custom-background-preview"
                role="img"
                aria-label="Custom background image preview"
            >
                <span>No custom image selected</span>
            </div>

            <div class="custom-background-actions">

                <label
                    for="customBackgroundInput"
                    class="custom-image-btn"
                >
                    Choose Image
                </label>

                <button
                    id="removeCustomBackgroundBtn"
                    class="remove-custom-image-btn"
                    type="button"
                    aria-label="Remove custom background image"
                >
                    Remove Image
                </button>

            </div>

            <input
                id="customBackgroundInput"
                type="file"
                accept="image/*"
                aria-label="Choose a custom background image"
                hidden
            >

            <p class="custom-background-help">
                Choose an image from your device. It will be stored
                locally on this device.
            </p>

        </div>

    </section>

</main>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>

</html>
