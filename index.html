<body>


<main class="calculator">

    <!-- Header -->
    <header class="calculator-header">
        <h1>Calculator</h1>

        <button
            id="themeBtn"
            class="theme-btn"
            type="button"
            aria-label="Toggle theme"
        >
            <i class="fa-solid fa-sun"></i>
        </button>
    </header>


    <!-- Display -->
    <section
        id="calculatorDisplay"
        class="display"
    >
        <div
            id="displayBackground"
            class="display-background"
            aria-hidden="true"
        ></div>

        <div
            class="display-overlay"
            aria-hidden="true"
        ></div>

        <div class="display-content">
            <div
                id="historyDisplay"
                class="history-display"
            ></div>

            <div
                id="currentDisplay"
                class="current-display"
            >
                0
            </div>
        </div>
    </section>



<!-- Scientific Buttons -->
<section class="scientific-buttons" aria-label="Scientific calculator functions">
    <button class="btn scientific" type="button" data-action="scientific" data-value="sin">sin</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="cos">cos</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="tan">tan</button>

    <button class="btn scientific" type="button" data-action="scientific" data-value="sqrt" aria-label="Square root">√</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="square" aria-label="Square">x²</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="power" aria-label="Power">xʸ</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="pi" aria-label="Pi">π</button>
    <button class="btn scientific" type="button" data-action="scientific" data-value="inverse" aria-label="Reciprocal">1/x</button>
</section>

<!-- Main Calculator Buttons -->
<section class="buttons" aria-label="Calculator keypad">
    <button class="btn function" type="button" data-action="clear">AC</button>
    <button class="btn function delete-btn" type="button" data-action="delete" aria-label="Delete last character">DEL</button>
    <button class="btn function" type="button" data-action="percentage" aria-label="Percentage">%</button>

    <button class="btn operator" type="button" data-action="operator" data-value="/" aria-label="Divide">÷</button>

    <button class="btn number" type="button" data-action="number" data-value="7" aria-label="Seven">7</button>
    <button class="btn number" type="button" data-action="number" data-value="8" aria-label="Eight">8</button>
    <button class="btn number" type="button" data-action="number" data-value="9" aria-label="Nine">9</button>

    <button class="btn operator" type="button" data-action="operator" data-value="*" aria-label="Multiply">×</button>

    <button class="btn number" type="button" data-action="number" data-value="4" aria-label="Four">4</button>
    <button class="btn number" type="button" data-action="number" data-value="5" aria-label="Five">5</button>
    <button class="btn number" type="button" data-action="number" data-value="6" aria-label="Six">6</button>

    <button class="btn operator" type="button" data-action="operator" data-value="-" aria-label="Subtract">−</button>

    <button class="btn number" type="button" data-action="number" data-value="1" aria-label="One">1</button>
    <button class="btn number" type="button" data-action="number" data-value="2" aria-label="Two">2</button>
    <button class="btn number" type="button" data-action="number" data-value="3" aria-label="Three">3</button>

    <button class="btn operator" type="button" data-action="operator" data-value="+" aria-label="Add">+</button>

    <button class="btn number zero" type="button" data-action="number" data-value="0" aria-label="Zero">0</button>
    <button class="btn number" type="button" data-action="number" data-value="." aria-label="Decimal point">.</button>
    <button class="btn equals" type="button" data-action="equals" aria-label="Calculate result">=</button>
</section>



    <!-- History -->
    <button
        id="historyBtn"
        class="history-toggle"
        type="button"
    >
        HISTORY
    </button>

    <section
        id="historyPanel"
        class="history-panel hidden"
    >
        <div class="history-header">

            <h2>Calculation History</h2>

            <button
                id="clearHistoryBtn"
                class="clear-history"
                type="button"
            >
                Clear
            </button>

        </div>

        <div
            id="historyList"
            class="history-list"
        ></div>
    </section>


    <!-- Display Background Settings -->
    <button
        id="backgroundSettingsBtn"
        class="background-settings-toggle"
        type="button"
    >
        DISPLAY BACKGROUND
    </button>

    <section
        id="backgroundSettings"
        class="background-settings hidden"
    >

        <div class="background-settings-header">
            <h2>Display Background</h2>
        </div>


        <!-- Background On / Off -->
        <div class="setting-row">

            <span>Background</span>

            <button
                id="backgroundToggle"
                class="setting-switch active"
                type="button"
            >
                ON
            </button>

        </div>


        <!-- Background Style -->
        <div class="setting-group">

            <h3>Style</h3>

            <div class="background-options">

                <button
                    class="background-option active"
                    data-background="abstract"
                    type="button"
                >
                    Abstract
                </button>

                <button
                    class="background-option"
                    data-background="technology"
                    type="button"
                >
                    Technology
                </button>

                <button
                    class="background-option"
                    data-background="custom"
                    type="button"
                >
                    Custom
                </button>

            </div>

        </div>


        <!-- Background Opacity -->
        <div class="setting-group">

            <label for="backgroundOpacity">
                Opacity
            </label>

            <input
                id="backgroundOpacity"
                type="range"
                min="10"
                max="40"
                value="25"
            >

        </div>


        <!-- Background Animation -->
        <div class="setting-row">

            <span>Animation</span>

            <button
                id="backgroundAnimationToggle"
                class="setting-switch active"
                type="button"
            >
                ON
            </button>

        </div>


        <!-- Custom Image -->
        <div
            id="customBackgroundArea"
            class="custom-background-area hidden"
        >

            <label for="customBackgroundInput">
                Custom Image
            </label>

            <div
                id="customBackgroundPreview"
                class="custom-background-preview"
            >
                <span>No custom image selected</span>
            </div>

            <div class="custom-background-actions">

                <label
                    for="customBackgroundInput"
                    class="custom-image-btn"
                >
                    Choose Image
                </label>

                <button
                    id="removeCustomBackgroundBtn"
                    class="remove-custom-image-btn"
                    type="button"
                >
                    Remove Image
                </button>

            </div>

            <input
                id="customBackgroundInput"
                type="file"
                accept="image/*"
                hidden
            >

            <p class="custom-background-help">
                Choose an image from your device. It will be stored
                locally on this device.
            </p>

        </div>

    </section>

</main>

<script src="script.js"></script>
