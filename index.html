    <meta charset="UTF-8">

    <meta

    >

    >

    >

    <meta

        content="A fast, free scientific calculator built with HTML5, CSS3 and JavaScript. Works online and offline and can be installed as a PWA."
    >

    <meta

        content="https://calculator-pwa-eh4b.onrender.com/"
    >

        content="Calculator PWA"
    >

        property="og:image"
        content="https://calculator-pwa-eh4b.onrender.com/icons/icon-512.png"
    >

    <!-- Twitter / X -->
    <meta
        name="twitter:card"
        content="summary"
    >

    <meta

        content="Free Online Scientific Calculator | Calculator PWA"
    >

    <meta
        name="twitter:description"
        content="A fast, free scientific calculator that works online and offline as an installable PWA."
    >

    <meta

        content="https://calculator-pwa-eh4b.onrender.com/icons/icon-512.png"
    >

    <!-- PWA -->
    <meta
        name="theme-color"
        content="#0f1117"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Calculator"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- Icons -->
    <link
        rel="icon"
        href="icons/icon-192.png"
        type="image/png"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <!-- Font Awesome Local -->
    <link
        rel="stylesheet"
        href="fontawesome/css/fontawesome.css"
    >

    <link

        href="fontawesome/css/solid.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="calculator">

        <!-- ========================================
             HEADER
        ========================================= -->

        <header class="calculator-header">

            <h1>Calculator</h1>

            <button
                id="themeBtn"
                class="theme-btn"
                type="button"
                aria-label="Toggle theme"
            >
                <i class="fa-solid fa-sun"></i>
            </button>

        </header>


        <!-- ========================================
             DISPLAY
        ========================================= -->

        <section
            id="calculatorDisplay"
            class="display"
        >

            <div
                id="displayBackground"
                class="display-background"
                aria-hidden="true"
            ></div>

            <div
                class="display-overlay"
                aria-hidden="true"
            ></div>

            <div class="display-content">

                <div
                    id="historyDisplay"
                    class="history-display"
                ></div>

                <div
                    id="currentDisplay"
                    class="current-display"
                >
                    0
                </div>

            </div>

        </section>


        <!-- ========================================
             SCIENTIFIC BUTTONS
        ========================================= -->

        <section class="scientific-buttons">

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="sin"
            >
                sin
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="cos"
            >
                cos
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="tan"
            >
                tan
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="sqrt"
            >
                √
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="square"
            >
                x²
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="power"
            >
                xʸ
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="pi"
            >
                π
            </button>

            <button
                class="btn scientific"
                data-action="scientific"
                data-value="inverse"
            >
                1/x
            </button>

        </section>


        <!-- ========================================
             MAIN CALCULATOR BUTTONS
        ========================================= -->

        <section class="buttons">

            <button
                class="btn function"
                data-action="clear"
            >
                AC
            </button>

            <button
                class="btn function delete-btn"
                data-action="delete"
            >
                DEL
            </button>

            <button
                class="btn function"
                data-action="percentage"
            >
                %
            </button>

            <button
                class="btn operator"
                data-action="operator"
                data-value="/"
            >
                ÷
            </button>


            <button
                class="btn number"
                data-action="number"
                data-value="7"
            >
                7
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="8"
            >
                8
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="9"
            >
                9
            </button>

            <button
                class="btn operator"
                data-action="operator"
                data-value="*"
            >
                ×
            </button>


            <button
                class="btn number"
                data-action="number"
                data-value="4"
            >
                4
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="5"
            >
                5
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="6"
            >
                6
            </button>

            <button
                class="btn operator"
                data-action="operator"
                data-value="-"
            >
                −
            </button>


            <button
                class="btn number"
                data-action="number"
                data-value="1"
            >
                1
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="2"
            >
                2
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="3"
            >
                3
            </button>

            <button
                class="btn operator"
                data-action="operator"
                data-value="+"
            >
                +
            </button>


            <button
                class="btn number zero"
                data-action="number"
                data-value="0"
            >
                0
            </button>

            <button
                class="btn number"
                data-action="number"
                data-value="."
            >
                .
            </button>

            <button
                class="btn equals"
                data-action="equals"
            >
                =
            </button>

        </section>


        <!-- ========================================
             HISTORY
        ========================================= -->

        <button
            id="historyBtn"
            class="history-toggle"
            type="button"
        >
            HISTORY
        </button>


        <section
            id="historyPanel"
            class="history-panel hidden"
        >

            <div class="history-header">

                <h2>Calculation History</h2>

                <button
                    id="clearHistoryBtn"
                    class="clear-history"
                    type="button"
                >
                    Clear
                </button>

            </div>

            <div
                id="historyList"
                class="history-list"
            ></div>

        </section>


        <!-- ========================================
             DISPLAY BACKGROUND SETTINGS
        ========================================= -->

        <button
            id="backgroundSettingsBtn"
            class="background-settings-toggle"
            type="button"
        >
            DISPLAY BACKGROUND
        </button>


        <section
            id="backgroundSettings"
            class="background-settings hidden"
        >

            <div class="background-settings-header">

                <h2>Display Background</h2>

            </div>


            <!-- ON / OFF -->

            <div class="setting-row">

                <span>Background</span>

                <button
                    id="backgroundToggle"
                    class="setting-switch active"
                    type="button"
                >
                    ON
                </button>

            </div>


            <!-- STYLE -->

            <div class="setting-group">

                <h3>Style</h3>

                <div class="background-options">

                    <button
                        class="background-option active"
                        data-background="abstract"
                        type="button"
                    >
                        Abstract
                    </button>

                    <button
                        class="background-option"
                        data-background="technology"
                        type="button"
                    >
                        Technology
                    </button>

                    <button
                        class="background-option"
                        data-background="custom"
                        type="button"
                    >
                        Custom
                    </button>

                </div>

            </div>


            <!-- OPACITY -->

            <div class="setting-group">

                <label for="backgroundOpacity">
                    Opacity
                </label>

                <input
                    id="backgroundOpacity"
                    type="range"
                    min="10"
                    max="40"
                    value="25"
                >

            </div>


            <!-- ANIMATION -->

            <div class="setting-row">

                <span>Animation</span>

                <button
                    id="backgroundAnimationToggle"
                    class="setting-switch active"
                    type="button"
                >
                    ON
                </button>

            </div>


            <!-- CUSTOM IMAGE -->

            <div
                id="customBackgroundArea"
                class="custom-background-area hidden"
            >

                <label for="customBackgroundInput">
                    Custom Image
                </label>

                <div
                    id="customBackgroundPreview"
                    class="custom-background-preview"
                >
                    <span>No custom image selected</span>
                </div>

                <div class="custom-background-actions">

                    <label
                        for="customBackgroundInput"
                        class="custom-image-btn"
                    >
                        Choose Image
                    </label>

                    <button
                        id="removeCustomBackgroundBtn"
                        class="remove-custom-image-btn"
                        type="button"
                    >
                        Remove Image
                    </button>

                </div>

                <input
                    id="customBackgroundInput"
                    type="file"
                    accept="image/*"
                    hidden
                >

                <p class="custom-background-help">
                    Choose an image from your device. It will be stored
                    locally on this device.
                </p>

            </div>

        </section>

    </main>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="script.js"></script>

</body>

</html>
